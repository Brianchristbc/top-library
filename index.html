<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <script src="./script.js" defer></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Library</h1>
    <button id="openDialogButton">Add Book</button>
    <dialog id="addBookDialog">
      <button id="closeDialogButton">X</button>
      <h2>Add a Book</h2>
      <p>Fill in the details of the book you want to add.</p>
      <form action="" id="addBookForm">
        <div class="input-field">
          <input
            type="text"
            id="addBookTitle"
            placeholder=" Book Title goes here!"
          />
          <input
            type="text"
            id="addBookAuthor"
            placeholder=" Author's name goes here!"
          />
          <input
            type="text"
            id="addBookGenre"
            placeholder=" Genre type goes here!"
          />
        </div>
        <button type="submit" id="addBookButton">Add Book To Library</button>
      </form>
    </dialog>

    <div class="display-shelf"></div>
  </body>
</html>
